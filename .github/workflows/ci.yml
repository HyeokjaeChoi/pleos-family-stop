name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate: # required status check on main; always reports, skips Gradle for docs-only changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect code changes
        id: changes
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          if git diff --name-only "$base" HEAD | grep -qvE '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change: skipping Gradle steps."
          fi
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: steps.changes.outputs.code == 'true'
        uses: gradle/actions/setup-gradle@v4
      - if: steps.changes.outputs.code == 'true'
        run: scripts/check-design-tokens.sh
      - if: steps.changes.outputs.code == 'true'
        run: ./gradlew ktlintCheck testDebugUnitTest assembleDebug
