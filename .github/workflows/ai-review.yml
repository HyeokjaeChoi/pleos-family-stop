name: ai-review

# 심층 AI 리뷰 (Claude Opus). 푸시마다 돌지 않고, PR에 `claude-review-request` 라벨을
# 붙일 때만 실행한다. 일상 리뷰는 로컬 Claude Code(구독 쿼타)로 먼저 하고, 머지 전
# 전체 맥락(코드베이스·ADR·PRD·이슈 이력) 리뷰가 필요할 때 라벨을 붙인다.
# 실행이 끝나면 라벨을 떼므로, 다시 붙이면 재리뷰한다.
#
# 1차: `claude -p` + ANTHROPIC_API_KEY (Console API 크레딧, 구독 프로모션 크레딧 포함).
#      claude-code-action 경유 호출은 "Claude Code 사용"으로 분류돼 프로모션 크레딧이
#      적용되지 않으므로 CLI를 직접 실행한다. https://support.claude.com/en/articles/17154008
# 2차: 1차가 실패했고 아직 요약 코멘트가 없을 때만 claude-code-action +
#      CLAUDE_CODE_OAUTH_TOKEN (구독 쿼타). 요약 코멘트의 마커로 중복 리뷰를 막는다.
# 리뷰 결과는 참고용이며 required check가 아니다.

on:
  pull_request:
    types: [labeled]

concurrency:
  # 라벨별 그룹: 다른 라벨(figma-done 등)이 붙어도 진행 중인 리뷰를 취소하지 않는다.
  group: ai-review-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.label.name == 'claude-review-request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      MARKER: "<!-- ai-review:${{ github.event.pull_request.head.sha }} -->"
      PROMPT: |
        REPO: ${{ github.repository }}
        PR NUMBER: ${{ github.event.pull_request.number }}
        HEAD SHA: ${{ github.event.pull_request.head.sha }}

        이 PR을 심층 리뷰한다. PR 브랜치는 전체 이력과 함께 체크아웃되어 있다.
        diff만 보지 말고 이 변경이 제품·코드베이스 전체에서 맞는지 판단한다.

        먼저 맥락을 모은다:
        - `gh pr view --json title,body,closingIssuesReferences,files` / `gh pr diff`: PR 설명, 연결 이슈, 변경 내용
        - `gh issue view <n> --json title,body,comments`: 연결 이슈의 요구사항·결정 이력
        - AGENTS.md, GLOSSARY.md(있으면), docs/adr/*: 아키텍처·도메인 결정
        - manyfast-export.md: PRD (대상 사용자, 핵심 가치, 정책, 범위)
        - DESIGN.md, docs/research/*: 디자인·리서치 근거
        - 변경된 파일의 주변 코드, 호출부, `git log`/`git blame`로 이전 변경 의도
        - 필요하면 `gh pr list --state merged --search <키워드>`로 관련 과거 PR

        판단 기준 (우선순위 순):
        1. 정확성 버그 (null, 경계값, 상태·동시성, 콜백 누락, 잘못된 조건)
        2. ADR·이전 결정과의 충돌 (뒤집는다면 ADR 갱신이 필요한지)
        3. PRD·비즈니스 결정과의 불일치 (범위 밖 기능, 정책 위반, 대상 사용자와 안 맞는 UX)
        4. 모듈 경계·아키텍처 규칙 위반 (feature↔feature, impl↔impl, Pleos SDK는 :impl:pleos에만)
        5. 주행 중 안전·접근성 (터치 타깃, 운전자 주의 분산)
        6. 코드베이스 전반의 중복·기존 헬퍼 재사용 누락
        7. 테스트 누락 (분기 있는 로직에 테스트가 없을 때만)

        스타일·취향 지적은 하지 않는다 (ktlint와 gate가 담당).
        구체적인 실패 시나리오나 근거 문서(경로)를 댈 수 있는 지적만 남긴다.
        전체 요약은 `gh pr comment`로 한국어로 정확히 한 번만 남기고, 본문 첫 줄은 반드시
        `<!-- ai-review:${{ github.event.pull_request.head.sha }} -->` 로 시작한다. 문제가 없으면 요약에 "특이사항 없음"이라고 쓴다.
        요약에는 확인한 맥락(문서·이슈·PR)을 짧게 나열한다.
        GitHub 코멘트로만 결과를 남기고 메시지로 리뷰 본문을 출력하지 않는다.

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # 인라인 코멘트 기준(head SHA)과 같은 트리를 본다.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Review (API credits, claude -p)
        id: api
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "::warning::ANTHROPIC_API_KEY not set"; exit 1; }
          npm install -g @anthropic-ai/claude-code >/dev/null
          INLINE="코드 문제는 줄 단위 코멘트로 남긴다:
          gh api repos/${GITHUB_REPOSITORY}/pulls/${PR}/comments -f commit_id=${SHA} -f path=<파일> -F line=<새 파일 기준 줄> -f side=RIGHT -f body=<내용>"
          claude -p "${PROMPT}
          ${INLINE}" \
            --model opus \
            --max-turns 80 \
            --allowedTools "Read,Grep,Glob,Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git diff:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh api repos/${GITHUB_REPOSITORY}/pulls/${PR}/comments:*)" \
            --output-format json > result.json || true
          jq '{is_error, subtype, num_turns, total_cost_usd, result: (.result // "" | .[0:300])}' result.json || cat result.json
          jq -e '.is_error == false' result.json >/dev/null

      - name: Check summary posted
        id: posted
        if: always()
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"${MARKER}\"))] | length" | awk '{s+=$1} END {print s+0}')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "summary comments for ${SHA}: $n"

      - name: Review (subscription fallback)
        if: steps.api.outcome == 'failure' && steps.posted.outputs.count == '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            ${{ env.PROMPT }}
            코드 문제는 mcp__github_inline_comment__create_inline_comment (confirmed: true)로 남긴다.
            1차 리뷰가 중간에 실패했을 수 있다. 먼저 `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`로
            이 HEAD SHA에 이미 달린 줄 단위 코멘트를 확인하고, 같은 지적은 다시 달지 않는다.
          claude_args: >-
            --model opus
            --max-turns 80
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git diff:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*)"

      - name: Remove trigger label
        # 취소된 run(재요청으로 대체됨)은 새 요청의 라벨을 지우지 않는다.
        if: ${{ !cancelled() }}
        # 이미 없으면(404) 통과, 지운 뒤에도 남아 있으면 실패로 드러낸다.
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR}/labels/claude-review-request" >/dev/null 2>&1 || true
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/labels" --jq '.[].name' | grep -qx claude-review-request; then
            echo "::error::claude-review-request label still present"; exit 1
          fi
