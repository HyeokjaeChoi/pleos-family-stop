name: ai-review

# PR마다 Claude(Sonnet)가 리뷰한다.
# 1차: ANTHROPIC_API_KEY (API 크레딧). 실패(크레딧 소진·키 없음 등) 시
# 2차: CLAUDE_CODE_OAUTH_TOKEN (구독 쿼타).
# 리뷰 결과는 참고용이며 required check가 아니다.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      CLAUDE_ARGS: >-
        --model claude-sonnet-5-5
        --max-turns 30
        --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
      PROMPT: |
        REPO: ${{ github.repository }}
        PR NUMBER: ${{ github.event.pull_request.number }}

        이 PR을 리뷰한다. PR 브랜치는 이미 체크아웃되어 있다.
        먼저 AGENTS.md를 읽고 프로젝트 규칙(모듈 의존 방향, Pleos SDK는 :impl:pleos에만,
        feature/app 화면은 :core:designsystem 토큰만 사용)을 기준으로 삼는다.

        우선순위:
        1. 정확성 버그 (null, 경계값, 상태·동시성, 콜백 누락, 잘못된 조건)
        2. 모듈 경계·아키텍처 규칙 위반
        3. 주행 중 안전·접근성 (터치 타깃, 운전자 주의 분산)
        4. 테스트 누락 (분기 있는 로직에 테스트가 없을 때만)

        스타일·취향 지적은 하지 않는다 (ktlint와 gate가 담당).
        구체적인 실패 시나리오를 댈 수 있는 지적만 남긴다.
        코드 문제는 mcp__github_inline_comment__create_inline_comment (confirmed: true)로,
        전체 요약은 `gh pr comment`로 한국어로 한 번만 남긴다. 문제가 없으면 요약에 "특이사항 없음"이라고 쓴다.
        GitHub 코멘트로만 결과를 남기고 메시지로 리뷰 본문을 출력하지 않는다.

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review (API credits)
        id: api
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ env.PROMPT }}
          claude_args: ${{ env.CLAUDE_ARGS }}

      - name: Review (subscription fallback)
        if: steps.api.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ env.PROMPT }}
          claude_args: ${{ env.CLAUDE_ARGS }}
