name: ai-review

# PR마다 Claude(Sonnet)가 리뷰한다.
# 1차: `claude -p` + ANTHROPIC_API_KEY (Console API 크레딧, 구독 프로모션 크레딧 포함).
#      claude-code-action 경유 호출은 "Claude Code 사용"으로 분류돼 프로모션 크레딧이
#      적용되지 않으므로 CLI를 직접 실행한다.
#      https://support.claude.com/en/articles/17154008
# 2차: 1차 실패(크레딧 소진·키 없음 등) 시 claude-code-action + CLAUDE_CODE_OAUTH_TOKEN (구독 쿼타).
# 리뷰 결과는 참고용이며 required check가 아니다.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      PROMPT: |
        REPO: ${{ github.repository }}
        PR NUMBER: ${{ github.event.pull_request.number }}
        HEAD SHA: ${{ github.event.pull_request.head.sha }}

        이 PR을 리뷰한다. PR 브랜치는 이미 체크아웃되어 있다.
        먼저 AGENTS.md를 읽고 프로젝트 규칙(모듈 의존 방향, Pleos SDK는 :impl:pleos에만,
        feature/app 화면은 :core:designsystem 토큰만 사용)을 기준으로 삼는다.
        변경 내용은 `gh pr diff`로 확인한다.

        우선순위:
        1. 정확성 버그 (null, 경계값, 상태·동시성, 콜백 누락, 잘못된 조건)
        2. 모듈 경계·아키텍처 규칙 위반
        3. 주행 중 안전·접근성 (터치 타깃, 운전자 주의 분산)
        4. 테스트 누락 (분기 있는 로직에 테스트가 없을 때만)

        스타일·취향 지적은 하지 않는다 (ktlint와 gate가 담당).
        구체적인 실패 시나리오를 댈 수 있는 지적만 남긴다.
        전체 요약은 `gh pr comment`로 한국어로 한 번만 남긴다. 문제가 없으면 요약에 "특이사항 없음"이라고 쓴다.
        GitHub 코멘트로만 결과를 남기고 메시지로 리뷰 본문을 출력하지 않는다.

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review (API credits, claude -p)
        id: api
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "::warning::ANTHROPIC_API_KEY not set"; exit 1; }
          npm install -g @anthropic-ai/claude-code >/dev/null
          INLINE="코드 문제는 줄 단위 코멘트로 남긴다:
          gh api repos/${GITHUB_REPOSITORY}/pulls/${PR}/comments -f commit_id=${SHA} -f path=<파일> -F line=<새 파일 기준 줄> -f side=RIGHT -f body=<내용>"
          claude -p "${PROMPT}
          ${INLINE}" \
            --model sonnet \
            --max-turns 30 \
            --allowedTools "Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${GITHUB_REPOSITORY}/pulls/${PR}/comments:*)" \
            --output-format json > result.json || true
          jq '{is_error, subtype, num_turns, total_cost_usd, result: (.result // "" | .[0:300])}' result.json
          jq -e '.is_error == false' result.json >/dev/null

      - name: Review (subscription fallback)
        if: steps.api.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            ${{ env.PROMPT }}
            코드 문제는 mcp__github_inline_comment__create_inline_comment (confirmed: true)로 남긴다.
          claude_args: >-
            --model sonnet
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
